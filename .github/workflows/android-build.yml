name: DIV Voice Smooth Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DIV-Voice-Smooth-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare, sign and verify release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/divvoice-release.jks"
          FINAL="app/build/outputs/apk/release/DIV-Voice-Smooth-final.apk"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/divvoice-aligned.apk"

          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "Using the configured GitHub release signing key."
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            SIGN_STOREPASS="$KEYSTORE_PASSWORD"
            SIGN_KEYPASS="$KEY_PASSWORD"
            SIGN_ALIAS="$KEY_ALIAS"
          else
            echo "Configured signing secrets are unavailable. Creating a fresh temporary release key for this build."
            echo "This fallback APK is signed for installation/testing; keep a permanent signing key for future updates."
            SIGN_STOREPASS="$(openssl rand -hex 24)"
            SIGN_KEYPASS="$SIGN_STOREPASS"
            SIGN_ALIAS="divvoice"
            keytool -genkeypair -noprompt               -keystore "$KEYSTORE_PATH"               -storepass "$SIGN_STOREPASS"               -keypass "$SIGN_KEYPASS"               -alias "$SIGN_ALIAS"               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=DIV Voice Smooth, OU=DivStudio, O=DivStudio Co Ltd, L=Lagos, ST=Lagos, C=NG"
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign             --ks "$KEYSTORE_PATH"             --ks-key-alias "$SIGN_ALIAS"             --ks-pass "pass:$SIGN_STOREPASS"             --key-pass "pass:$SIGN_KEYPASS"             --out "$FINAL"             "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose "$FINAL"
          test -s "$FINAL"

          rm -f "$ALIGNED" "$KEYSTORE_PATH"

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DIV-Voice-Smooth-final
          path: app/build/outputs/apk/release/DIV-Voice-Smooth-final.apk
          if-no-files-found: error
