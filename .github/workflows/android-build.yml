name: DIV Voice Smooth Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DIV-Voice-Smooth-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          [[ -z "$KEYSTORE_BASE64" ]] && { echo "Missing KEYSTORE_BASE64"; missing=1; }
          [[ -z "$KEYSTORE_PASSWORD" ]] && { echo "Missing KEYSTORE_PASSWORD"; missing=1; }
          [[ -z "$KEY_ALIAS" ]] && { echo "Missing KEY_ALIAS"; missing=1; }
          [[ -z "$KEY_PASSWORD" ]] && { echo "Missing KEY_PASSWORD"; missing=1; }
          if [[ "$missing" -ne 0 ]]; then
            echo "One or more GitHub Actions repository secrets are unavailable to this workflow."
            echo "Add them under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/divvoice-release.jks"
          test -s "$RUNNER_TEMP/divvoice-release.jks"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Sign and verify release APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/divvoice-aligned.apk"
          FINAL="app/build/outputs/apk/release/DIV-Voice-Smooth-final.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/divvoice-release.jks"             --ks-key-alias "$KEY_ALIAS"             --ks-pass "pass:$KEYSTORE_PASSWORD"             --key-pass "pass:$KEY_PASSWORD"             --out "$FINAL" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$FINAL"
          rm -f "$ALIGNED" "$RUNNER_TEMP/divvoice-release.jks"

      - name: Upload final signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DIV-Voice-Smooth-final
          path: app/build/outputs/apk/release/DIV-Voice-Smooth-final.apk
          if-no-files-found: error
